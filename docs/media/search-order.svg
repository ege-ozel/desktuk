<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-labelledby="title desc">
<title id="title">The start of a name comes first</title><desc id="desc">Searching for mix ranks Mix notes.txt and Mixer preset before Summer mix.wav. A highlighted first result is ready for Enter.</desc>
<rect width="880" height="310" rx="20" fill="#121b24"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="34" y="47" font-size="22" font-weight="600" fill="#ecf2f8">Less hunting. More finding.</text>
<text x="34" y="78" font-size="14" fill="#94a8bc">One letter is enough to start.</text>
<rect x="34" y="112" width="227" height="48" rx="9" fill="#192632" stroke="#71d8c2"/>
<text x="52" y="142" fill="#71d8c2" font-size="18">mix</text><path d="M83 125v24" stroke="#ecf2f8"/>
<path d="M295 137h54m-9-8 9 8-9 8" fill="none" stroke="#71d8c2" stroke-width="2"/>
<rect x="384" y="30" width="462" height="250" rx="12" fill="#192632" stroke="#2b3c4e"/>
<rect x="399" y="50" width="432" height="49" rx="7" fill="#223b43"/>
<text x="416" y="81" font-size="16" fill="#ecf2f8"><tspan fill="#71d8c2" font-weight="600">Mix</tspan> notes.txt</text>
<text x="416" y="131" font-size="16" fill="#ecf2f8"><tspan fill="#71d8c2" font-weight="600">Mix</tspan>er preset</text>
<text x="806" y="128" text-anchor="end" font-size="12" fill="#94a8bc">starts with</text>
<path d="M404 151h422" stroke="#2b3c4e"/>
<text x="416" y="184" font-size="16" fill="#ecf2f8">Summer <tspan fill="#71d8c2" font-weight="600">mix</tspan>.wav</text>
<text x="806" y="212" text-anchor="end" font-size="12" fill="#94a8bc">contains</text>
<text x="416" y="255" font-size="13" fill="#71d8c2">3 results · Enter opens the highlighted item</text>
<text x="34" y="230" font-size="14" fill="#ecf2f8">Prefix matches first.</text>
<text x="34" y="254" font-size="14" fill="#94a8bc">Then matches inside a name.</text>
</g></svg>