name: windows

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup component add clippy rustfmt
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --check

      - name: Build (release)
        run: cargo build --release --locked

      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings

      - name: Unit tests
        run: cargo test --release --locked

      - name: Circles runtime regressions with isolated TEMP fixtures
        shell: powershell
        run: ./scripts/circles-regression-test.ps1 -Exe target/release/DeskTuk.exe

      - name: Tray and second-launch recovery with isolated TEMP fixtures
        shell: powershell
        run: ./scripts/tray-regression-test.ps1 -Exe target/release/DeskTuk.exe

      - name: Open-circle dragging and click paging with isolated TEMP fixtures
        shell: powershell
        run: ./scripts/open-circle-drag-regression-test.ps1 -Exe target/release/DeskTuk.exe

      - name: Grid snapping and persistence with isolated TEMP fixtures
        shell: powershell
        run: ./scripts/open-circle-drag-regression-test.ps1 -Exe target/release/DeskTuk.exe -Grid 3

      - name: Always-on-top circles and tray recovery with isolated TEMP fixtures
        shell: powershell
        run: |
          ./scripts/open-circle-drag-regression-test.ps1 -Exe target/release/DeskTuk.exe -Topmost
          ./scripts/tray-regression-test.ps1 -Exe target/release/DeskTuk.exe -Topmost

      - name: Integration self-test on the runner's desktop
        # The physical desktop self-test remains panel-only; circle shell interactions
        # also need the owner's Win+D / Show Desktop / Peek assessment.
        shell: powershell
        run: ./scripts/windows-integration-test.ps1 -Exe target/release/DeskTuk.exe -Out test-results -ExplorerRestart

      - name: Upload executable and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeskTuk-windows-x64
          path: |
            target/release/DeskTuk.exe
            test-results/
